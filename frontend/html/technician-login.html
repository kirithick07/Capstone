
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HomeFix - Technician Login</title>

    <link rel="icon"
          type="image/png"
          href="../image/homefix-logo.png">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef5ff, #dce9ff);
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-container">

    <img
        src="../image/homefix-logo.png"
        alt="HomeFix Logo"
        class="logo"
    >


    <h1>Technician Login</h1>

    <p class="subtitle">
        Login to manage your assigned services
    </p>


    <form id="technicianLoginForm">


        <div class="form-group">

            <label for="technicianId">
                Technician ID
            </label>

            <input
                type="text"
                id="technicianId"
                placeholder="Enter Technician ID"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn">

            Login

        </button>


        <div
            id="message"
            class="message">
        </div>


    </form>


    <a
        href="login.html"
        class="back-link">

        ← Customer Login

    </a>


</div>


<script src="../technician-login.js"></script>


</body>

</html>
