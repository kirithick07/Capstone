
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeFix - Register</title>

    <link rel="stylesheet" href="../css/register.css">
    <link rel="icon" href="../../image/homefix-logo.png">
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <img src="../../image/homefix-logo.png"
                 alt="HomeFix Logo"
                 class="logo">

            <h1>HomeFix</h1>

            <h2>Create Account</h2>

            <p class="subtitle">
                Join HomeFix today
            </p>

            <!-- ================= REGISTER FORM ================= -->

            <form id="registerForm">

                <!-- FULL NAME -->
                <div class="input-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <!-- USERNAME -->
                <div class="input-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- PHONE -->
                <div class="input-group">
                    <label for="phone">Mobile Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        required
                    >
                </div>

                <!-- PASSWORD -->
                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            👁
                        </button>

                    </div>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="input-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="toggle-password">
                            👁
                        </button>

                    </div>
                </div>

                <!-- TERMS -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>

                <!-- MESSAGE -->
                <p
                    id="registerMessage"
                    class="register-message">
                </p>

                <!-- SEND OTP -->
                <button
                    type="submit"
                    id="registerButton"
                    class="register-button">
                    Create Account
                </button>

                <!-- LOGIN -->
                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>


            <!-- ================= OTP SECTION ================= -->

            <div
                id="otpSection"
                style="display: none;">

                <h2>Verify Email</h2>

                <p class="subtitle">
                    Enter the OTP sent to your email
                </p>

                <div class="input-group">

                    <label for="otp">
                        OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                    >

                </div>

                <p
                    id="otpMessage"
                    class="register-message">
                </p>

                <button
                    type="button"
                    id="verifyOtpButton"
                    class="register-button">
                    Verify OTP
                </button>

                <button
                    type="button"
                    id="resendOtpButton"
                    class="register-button"
                    style="margin-top: 10px;">
                    Resend OTP
                </button>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="../register.js"></script>

</body>

</html>
