<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HomeFix - Reset Password</title>

    <link rel="stylesheet" href="../css/reset-password.css">
</head>

<body>

    <div class="reset-container">

        <div class="reset-box">

            <img src="../../image/homefix-logo.png"
                 alt="HomeFix Logo"
                 class="homefix-logo">

            <h2>Reset Password</h2>

            <p>
                Enter your new password below.
            </p>

            <form id="resetPasswordForm">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <p id="message"></p>

            <a href="login.html">
                Back to Login
            </a>

        </div>

    </div>

    <script src="../reset-password.js"></script>

</body>

</html>
