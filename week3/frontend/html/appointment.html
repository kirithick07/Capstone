
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment - HomeFix</title>

    <link rel="stylesheet" href="../css/appointment.css">
</head>

<body>

    <!-- Top Header -->
    <header class="top-header">

        <div class="logo">
            <div class="logo-icon">HF</div>
            <h2>HomeFix</h2>
        </div>

        <a href="dashboard.html" class="dashboard-btn">
            🏠 Dashboard
        </a>

    </header>


    <!-- Main Appointment Page -->
    <main class="appointment-page">

        <div class="page-heading">
            <h1>My Appointments</h1>
            <p>View and manage your HomeFix service appointments</p>
        </div>


        <!-- Next Appointment -->
        <section class="next-appointment">

            <div class="section-heading">
                <h2>Next Appointment</h2>
                <span>Upcoming</span>
            </div>

            <div id="nextAppointment">
                <!-- JavaScript will display next appointment -->
            </div>

        </section>


        <!-- All Appointments -->
        <section class="all-appointments">

            <div class="section-heading">
                <h2>All Appointments</h2>

                <span id="appointmentCount">
                    0 Appointments
                </span>
            </div>

            <div id="appointmentsList">
                <!-- JavaScript will display appointments -->
            </div>

        </section>

    </main>


    <script src="../appointment.js"></script>

</body>
</html>
